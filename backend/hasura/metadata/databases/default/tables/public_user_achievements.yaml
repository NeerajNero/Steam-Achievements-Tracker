table:
  name: user_achievements
  schema: public
object_relationships:
  - name: achievement
    using:
      manual_configuration:
        column_mapping:
          achievements_code: achievements_code
          appid: appid
        insertion_order: null
        remote_table:
          name: achievements
          schema: public
  - name: game
    using:
      foreign_key_constraint_on: appid
  - name: user
    using:
      foreign_key_constraint_on: user_id
