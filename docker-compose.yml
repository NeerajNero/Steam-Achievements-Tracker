services:

  postgres:
    image: postgres:15
    container_name: gamepulse-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gamepulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5


  hasura:
    image: hasura/graphql-engine:v2.36.1
    container_name: gamepulse-hasura
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:postgres@postgres:5432/gamepulse
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_ADMIN_SECRET: supersecretkey
      HASURA_GRAPHQL_DEV_MODE: "true"


  redis:
    image: redis:7
    container_name: gamepulse-redis
    restart: always
    ports:
      - "6379:6379"

  nestjs:
    build:
      context: ./backend/nestjs-service
      dockerfile: Dockerfile
    container_name: gamepulse-nestjs
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gamepulse
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-supersecretkey@8123}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-supersecretkey@7892}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>{r.resume();process.exit(r.statusCode<500?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
